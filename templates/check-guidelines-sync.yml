# Copy this file into a consuming repo's `.github/workflows/` to fail CI
# automatically if the generated files ever drift from the canonical
# source (e.g. someone edited a generated file directly, or forgot to
# re-sync after a submodule update).
#
# NOTE: superseded by templates/workflows/checks-caller.yml, whose
# `guidelines-sync` job already does exactly this. Only use this file
# standalone if a repo needs the sync check but doesn't want the rest of
# checks.yml (Ruff/gitleaks/naming) — otherwise use checks-caller.yml and
# skip this one to avoid a duplicate check.

name: Check guidelines sync

on:
  pull_request:
    paths:
      - CONTRIBUTING.md
      - CLAUDE.md
      - SECURITY.md
      - CONTRIBUTING.local.md
      - CLAUDE.local.md
      - SECURITY.local.md
      - .guidelines/**

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify generated guideline files are up to date
        run: ./.guidelines/scripts/sync-guidelines.sh --check
